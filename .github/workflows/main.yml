name: Extract and Commit ZIP Contents

on:
  push:
    paths:
      - '**.zip' # Triggers only when a .zip file is added or modified

permissions:
  contents: write # Required to push commits back to the repository

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files and remove archives
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read -r zipfile; do
            echo "Extracting $zipfile..."
            # Extract into the same directory where the zip is located (-o overwrites existing files)
            unzip -o "$zipfile" -d "$(dirname "$zipfile")"
            # Remove the zip file so it doesn't trigger the workflow again
            rm "$zipfile"
          done

      - name: Commit and push extracted files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # Only commit if there are actual changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: extract and commit zip contents"
            git push
          else
            echo "No changes to commit."
          fi
