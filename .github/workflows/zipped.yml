name: Extract ZIP and Commit

on:
  push:
    paths:
      - 'uploads/*.zip'
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab

permissions:
  contents: write # Required so the workflow can push commits back to the repo

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the ZIP archive(s)
      - name: Extract ZIP contents
        run: |
          mkdir -p extracted
          for file in uploads/*.zip; do
            [ -e "$file" ] || continue
            unzip -o "$file" -d extracted/
          done

      # 3. Configure Git, stage extracted files, and push
      - name: Commit and push extracted files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          
          # Only commit if there are new or modified files to avoid workflow failure
          if ! git diff --staged --quiet; then
            git commit -m "Extract ZIP contents"
            git push
          else
            echo "No new changes to commit."
          fi
