name: Extract Root ZIP and Commit

on:
  push:
    paths:
      - '*.zip' # Watches for any .zip added or updated in the root folder
  workflow_dispatch: # Allows you to trigger it manually right now

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP contents from root
        run: |
          mkdir -p extracted
          for file in *.zip; do
            [ -e "$file" ] || continue
            echo "Extracting $file..."
            unzip -o "$file" -d extracted/
          done

      - name: Commit and push extracted files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git add extracted/
          
          if ! git diff --staged --quiet; then
            git commit -m "Extract root ZIP contents"
            git push
          else
            echo "No new changes to commit."
          fi
